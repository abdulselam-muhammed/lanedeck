name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: server starts on Linux and answers
        run: |
          echo "{}" > "$RUNNER_TEMP/c.json"
          PORT=4998 LANEDECK_CONFIG="$RUNNER_TEMP/c.json" node server/index.mjs > "$RUNNER_TEMP/s.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf 127.0.0.1:4998/api/config >/dev/null && break; sleep 1; done
          curl -sf 127.0.0.1:4998/api/config >/dev/null
          curl -sf 127.0.0.1:4998/api/load | grep -q '"platform":"linux"'
      - name: server log
        if: always()
        run: cat "$RUNNER_TEMP/s.log" || true
      - name: package contents
        run: |
          node scripts/scrub-build.mjs
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e 'const f=require(process.argv[1])[0].files.map(x=>x.path);const bad=f.filter(p=>/^\.next\/(cache|trace|types)|\.map$|machines\.json$/.test(p));if(bad.length||!f.includes("bin/lanedeck.mjs")||!f.includes(".next/BUILD_ID")){console.error("bad package",bad);process.exit(1)}console.log(f.length+" files")' "$RUNNER_TEMP/pack.json"
